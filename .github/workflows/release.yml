name: release
# 每次推送到 main 时，把已构建好的补丁 jar 发布/更新为 Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认补丁 jar 存在
        run: |
          ls -la elytra-hopper-lite-PATCHED.jar
          test -s elytra-hopper-lite-PATCHED.jar

      - name: 发布或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0-patched"
          TITLE="Elytra Hopper Lite — 补丁版 v3 (长按跳跃监测落地 + 20 tick 节流 + 松开即停)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在: $TAG，更新标题、说明与附件"
            gh release edit "$TAG" --title "$TITLE" --notes-file PATCH_NOTES.md
            gh release upload "$TAG" elytra-hopper-lite-PATCHED.jar --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file PATCH_NOTES.md \
              --target main \
              elytra-hopper-lite-PATCHED.jar
          fi
          echo "Release 就绪: $TAG"
