name: release
# 每次推送到 main 时，把已构建好的补丁 jar 发布/更新为 Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 选取最新补丁 jar（数字前缀最大者）
        run: |
          JAR=$(ls [0-9]*_elytra-hopper-lite-PATCHED.jar | sort -V | tail -1)
          echo "使用: $JAR"
          test -s "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: 发布或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0-patched"
          TITLE="Elytra Hopper Lite — 补丁版 (文件名数字=版本, 当前 5=三重落地检测)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在: $TAG，更新标题、说明与附件"
            gh release edit "$TAG" --title "$TITLE" --notes-file PATCH_NOTES.md
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file PATCH_NOTES.md \
              --target main \
              "$JAR"
          fi
          echo "Release 就绪: $TAG"
