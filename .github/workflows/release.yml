name: release
# On every push to main, publish the patched jar with the largest numeric prefix as a Release
# (the old Release is deleted and rebuilt so the asset stays unique)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest patched jar (largest numeric prefix)
        run: |
          JAR=$(ls [0-9]*_elytra-hopper-lite-PATCHED.jar | sort -V | tail -1)
          echo "Using: $JAR"
          test -s "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Rebuild Release (delete then create, single asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0-patched"
          TITLE="Elytra Hopper Lite - Patched v8 (fix jumps-once deadlock, landing-level detection, no latch)"
          # Delete the old Release, its tag and assets so the asset stays unique
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file PATCH_NOTES.md \
            --target main \
            "$JAR"
          echo "Release ready: $TAG"
