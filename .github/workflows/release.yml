name: release
# 每次推送到 main 时，把数字前缀最大的补丁 jar 发布为 Release（旧 Release 整体删除重建，附件保持唯一）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 选取最新补丁 jar（数字前缀最大者）
        run: |
          JAR=$(ls [0-9]*_elytra-hopper-lite-PATCHED.jar | sort -V | tail -1)
          echo "使用: $JAR"
          test -s "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: 重建 Release（先删后建，附件唯一）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0-patched"
          TITLE="Elytra Hopper Lite — 补丁版 v7 (修复NoSuchMethodError崩溃, owner改LocalPlayer)"
          # 删除旧 Release 及其 tag/附件，保证附件唯一
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file PATCH_NOTES.md \
            --target main \
            "$JAR"
          echo "Release 就绪: $TAG"
