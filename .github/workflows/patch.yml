name: patch
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: decompile
        run: |
          curl -sL -o cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          mkdir -p dec && cd dec && unzip -oq ../orig.jar
          java -jar ../cfr.jar --outputdir ../src_out ../dec/com/santr/elytrahopper/ElytraHopperClient.class > ../dec.log 2>&1 || true
          ls -R ../src_out > ../files.txt 2>&1 || true
      - name: commit
        run: |
          git config user.email ci@local; git config user.name ci
          git add -f src_out files.txt dec.log || true
          git commit -m "decompiled $(date +%s)" || true
          git push
