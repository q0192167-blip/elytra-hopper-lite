name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log | tail -150
      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: elytra-hopper-lite
          path: build/libs/*.jar
      - name: Commit jar
        if: always()
        run: |
          mkdir -p jars
          ls -laR build/libs > libs.txt 2>&1 || true
          find build -name '*.jar' -exec cp {} jars/ \; || true
          ls -la jars > jars.txt 2>&1 || true
          git config user.email ci@local
          git config user.name ci
          git add -f jars libs.txt jars.txt
          git commit -m "jar $(date +%s)" || true
          git push
      - name: Commit log
        if: always()
        run: |
          git config user.email ci@local
          git config user.name ci
          git add -f build.log
          git commit -m "build log $(date +%s)" || true
          git push
